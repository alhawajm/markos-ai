appId: com.markos.mobile
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Welcome back
    timeout: 60000
- tapOn: Email
- inputText: ${MAESTRO_STORE_EMAIL}
- tapOn: Password
- inputText: ${MAESTRO_STORE_PASSWORD}
- hideKeyboard
- tapOn: Log in
- extendedWaitUntil:
    visible: Overview
    timeout: 60000
- tapOn: Campaigns
- tapOn: Search campaigns
- inputText: Pearl Studio workshop launch
- hideKeyboard
- extendedWaitUntil:
    visible: ".*Pearl Studio workshop launch.*"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: store-01-campaigns
- tapOn: Create
- extendedWaitUntil:
    visible: Creative workshops in Manama
    timeout: 60000
- tapOn: Creative workshops in Manama
- tapOn: Caption
- waitForAnimationToEnd
- takeScreenshot: store-02-create
- tapOn: Back
- tapOn: Calendar
- waitForAnimationToEnd
- takeScreenshot: store-03-calendar
- tapOn: Overview
- tapOn: Workspace and settings
- scrollUntilVisible:
    element: Business profile
    direction: UP
- tapOn: Business profile
- extendedWaitUntil:
    visible: ".*Pearl Studio.*"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: store-04-business-profile
- tapOn: Back
- scrollUntilVisible:
    element: Language
    direction: DOWN
- tapOn: Language
- tapOn: العربية
- tapOn:
    text: إغلاق
    optional: true
- tapOn: رجوع
- tapOn: الحملات
- waitForAnimationToEnd
- takeScreenshot: store-05-arabic-campaigns
- tapOn: الرئيسية
- tapOn: مساحة العمل والإعدادات
- scrollUntilVisible:
    element: المظهر
    direction: DOWN
- tapOn: المظهر
- tapOn: داكن
- tapOn:
    text: إغلاق
    optional: true
- tapOn: رجوع
- tapOn: الحملات
- waitForAnimationToEnd
- takeScreenshot: store-06-arabic-dark-campaigns
