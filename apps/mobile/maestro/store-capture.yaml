appId: com.markos.mobile
---
- launchApp
- extendedWaitUntil:
    visible: Welcome back
    timeout: 60000
- takeScreenshot: diagnostic-empty-login
- scrollUntilVisible:
    element:
      text: ".*Email.*"
    direction: DOWN
    timeout: 20000
- tapOn: ".*Email.*"
- inputText: ${MAESTRO_STORE_EMAIL}
- tapOn: Password
- inputText: ${MAESTRO_STORE_PASSWORD}
- hideKeyboard
- tapOn: Log in
- extendedWaitUntil:
    visible: Overview
    timeout: 60000
- tapOn: Campaigns
- tapOn: Search
- inputText: Pearl Studio workshop launch
- hideKeyboard
- extendedWaitUntil:
    visible: ".*Pearl Studio workshop launch.*"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: store-01-campaigns
- tapOn: Create
- extendedWaitUntil:
    visible: ".*Creative workshops in Manama.*"
    timeout: 60000
- tapOn: ".*Creative workshops in Manama.*"
- tapOn: Edit
- tapOn: Caption
- waitForAnimationToEnd
- takeScreenshot: store-02-create
- tapOn: Preview
- scrollUntilVisible:
    element: pearl-studio-example.jpg
    direction: DOWN
    centerElement: true
- takeScreenshot: store-03-post-preview
- tapOn: Back
- tapOn: Calendar
- waitForAnimationToEnd
- takeScreenshot: store-04-calendar
- tapOn: Overview
- tapOn: Workspace and settings
- scrollUntilVisible:
    element: Business profile
    direction: UP
- tapOn: Business profile
- tapOn: Strategy
- tapOn: Business
- extendedWaitUntil:
    visible: ".*Pearl Studio.*"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: store-05-business-profile
- tapOn: Back
- scrollUntilVisible:
    element: Language
    direction: DOWN
- tapOn: Language
- tapOn: العربية
- tapOn:
    text: إغلاق
    optional: true
- tapOn: رجوع
- tapOn: الحملات
- waitForAnimationToEnd
- takeScreenshot: store-06-arabic-campaigns
- tapOn: الرئيسية
- tapOn: مساحة العمل والإعدادات
- scrollUntilVisible:
    element: المظهر
    direction: DOWN
- tapOn: المظهر
- tapOn: داكن
- tapOn:
    text: إغلاق
    optional: true
- tapOn: رجوع
- tapOn: الحملات
- waitForAnimationToEnd
- takeScreenshot: store-07-arabic-dark-campaigns
