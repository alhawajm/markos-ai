name: MARKOS service readiness
on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
permissions:
  contents: read
  issues: write
concurrency:
  group: service-readiness
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe Railway dependencies without generating content
        id: probe
        continue-on-error: true
        run: node scripts/check-service-readiness.mjs
      - name: Open or resolve the operational incident
        if: always()
        uses: actions/github-script@v7
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        with:
          script: |
            const title = 'MARKOS availability incident';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100 });
            const incident = issues.find(issue => issue.title === title && !issue.pull_request);
            const link = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (process.env.PROBE_OUTCOME === 'failure' && !incident) {
              await github.rest.issues.create({ owner, repo, title, body: `The independent readiness probe failed. Check API availability, private dependencies and scheduled-backup freshness.\n\n[Sanitized probe result](${link})\n\nNo customer data or credentials are included.` });
            } else if (process.env.PROBE_OUTCOME === 'success' && incident) {
              await github.rest.issues.update({ owner, repo, issue_number: incident.number, state: 'closed', state_reason: 'completed' });
            }
      - name: Fail the monitor when the probe failed
        if: steps.probe.outcome != 'success'
        run: exit 1
