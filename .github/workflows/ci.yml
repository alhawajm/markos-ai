name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AI_BASE_URL: http://localhost:8000
      API_BASE_URL: http://localhost:4000
      DATABASE_URL: postgresql://markos:markos@localhost:5432/markos_ci_test
      INSTAGRAM_DATABASE_TEST_URL: postgresql://markos:markos@localhost:5432/markos_ci_test
      INSTAGRAM_APP_ID: ci-instagram-app-id
      INSTAGRAM_APP_SECRET: ci-instagram-app-secret
      INSTAGRAM_OAUTH_REDIRECT_URI: http://localhost:4000/v1/workspace/instagram/oauth/callback
      INSTAGRAM_OAUTH_STATE_SECRET: ci-instagram-state-secret-at-least-32-bytes
      INSTAGRAM_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GOOGLE_OAUTH_ISSUER: https://accounts.google.com
      GOOGLE_OAUTH_JWKS_URL: https://www.googleapis.com/oauth2/v3/certs
      JWT_ACCESS_SECRET: ci-access-secret-change-me
      JWT_REFRESH_SECRET: ci-refresh-secret-change-me
      MEDIA_STORAGE_DIR: var/media
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: test
      SENTRY_TRACES_SAMPLE_RATE: "0"
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: "0"
      OPENSEARCH_URL: http://localhost:9200
      REDIS_URL: redis://localhost:6379
      WEB_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Install Node dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: corepack pnpm --filter api prisma generate

      - name: Install AI Python dependencies
        run: |
          python -m venv services/ai/.venv
          services/ai/.venv/bin/python -m pip install --upgrade pip
          services/ai/.venv/bin/python -m pip install -e "./services/ai[dev]"

      - name: Prepare OpenSearch host settings
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start local infrastructure
        run: docker compose up -d postgres redis opensearch

      - name: Wait for infrastructure
        run: |
          for i in {1..60}; do
            if docker compose exec -T postgres pg_isready -U markos -d markos; then
              break
            fi
            sleep 2
          done

          for i in {1..60}; do
            if docker compose exec -T redis redis-cli ping; then
              break
            fi
            sleep 2
          done

          for i in {1..90}; do
            if curl -fsS http://localhost:9200 >/dev/null; then
              break
            fi
            sleep 2
          done

          docker compose exec -T postgres pg_isready -U markos -d markos
          docker compose exec -T redis redis-cli ping
          curl -fsS http://localhost:9200 >/dev/null

      - name: Prepare disposable Instagram test database
        run: |
          docker compose exec -T postgres createdb -U markos markos_ci_test
          docker compose exec -T postgres \
            psql --set=ON_ERROR_STOP=1 -U markos -d markos_ci_test \
            --file=/docker-entrypoint-initdb.d/001-init.sql

      - name: Apply database migrations
        run: corepack pnpm --filter api prisma migrate deploy

      - name: Seed database
        run: corepack pnpm --filter api prisma db seed

      - name: Verify
        run: corepack pnpm verify

      - name: Build
        run: corepack pnpm build

      - name: Install Chromium
        run: corepack pnpm exec playwright-core install --with-deps chromium

      - name: Start built web application
        working-directory: apps/web
        run: |
          node_modules/.bin/next start --hostname 127.0.0.1 --port 3000 \
            > /tmp/markos-web.log 2>&1 &
          echo $! > /tmp/markos-web.pid
          ready=false
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/en/app/settings >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$(cat /tmp/markos-web.pid)" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat /tmp/markos-web.log
            exit 1
          fi

      - name: Test rendered Instagram Settings
        env:
          SETTINGS_BROWSER_BASE_URL: http://127.0.0.1:3000
        run: corepack pnpm --filter web test:browser

      - name: Dump web application log on failure
        if: failure()
        run: test ! -f /tmp/markos-web.log || cat /tmp/markos-web.log

      - name: Stop built web application
        if: always()
        run: test ! -f /tmp/markos-web.pid || kill "$(cat /tmp/markos-web.pid)" 2>/dev/null || true

      - name: Dump infrastructure logs on failure
        if: failure()
        run: docker compose logs --no-color postgres redis opensearch

      - name: Stop local infrastructure
        if: always()
        run: docker compose down -v
