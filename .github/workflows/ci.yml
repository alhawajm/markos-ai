name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify and Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      AI_BASE_URL: http://localhost:8000
      AI_CONTENT_TIMEOUT_SECONDS: "50"
      AI_HTTP_TIMEOUT_MS: "55000"
      AI_PROFILE_TIMEOUT_SECONDS: "50"
      AI_STRATEGY_TIMEOUT_SECONDS: "50"
      AI_TEXT_PROVIDER: local
      API_BASE_URL: http://localhost:4000
      DATABASE_URL: postgresql://markos:markos@localhost:5432/markos_ci_test
      INSTAGRAM_DATABASE_TEST_URL: postgresql://markos:markos@localhost:5432/markos_ci_test
      INSTAGRAM_APP_ID: ci-instagram-app-id
      INSTAGRAM_APP_SECRET: ci-instagram-app-secret
      INSTAGRAM_OAUTH_REDIRECT_URI: http://localhost:4000/v1/workspace/instagram/oauth/callback
      INSTAGRAM_OAUTH_STATE_SECRET: ci-instagram-state-secret-at-least-32-bytes
      INSTAGRAM_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      INTERNAL_SERVICE_TOKEN: ci-internal-service-token
      GOOGLE_OAUTH_ISSUER: https://accounts.google.com
      GOOGLE_OAUTH_JWKS_URL: https://www.googleapis.com/oauth2/v3/certs
      JWT_ACCESS_SECRET: ci-access-secret-change-me
      JWT_REFRESH_SECRET: ci-refresh-secret-change-me
      LLM_LONGFORM_MODEL: ci-strategy-model
      MEDIA_STORAGE_DIR: var/media
      META_WEBHOOK_VERIFY_TOKEN: ci-webhook-verify-token
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
      NODE_ENV: test
      SENTRY_TRACES_SAMPLE_RATE: "0"
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: "0"
      OPENSEARCH_URL: http://localhost:9200
      OPENAI_TIMEOUT_SECONDS: "45"
      REDIS_URL: redis://localhost:6379
      WEB_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Install Node dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: corepack pnpm --filter api prisma generate

      - name: Install AI Python dependencies
        run: |
          python -m venv services/ai/.venv
          services/ai/.venv/bin/python -m pip install --upgrade pip
          services/ai/.venv/bin/python -m pip install -e "./services/ai[dev]"

      - name: Prepare OpenSearch host settings
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start local infrastructure
        run: docker compose up -d postgres redis opensearch

      - name: Wait for infrastructure
        run: |
          for i in {1..60}; do
            if docker compose exec -T postgres pg_isready -U markos -d markos; then
              break
            fi
            sleep 2
          done

          for i in {1..60}; do
            if docker compose exec -T redis redis-cli ping; then
              break
            fi
            sleep 2
          done

          for i in {1..90}; do
            if curl -fsS http://localhost:9200 >/dev/null; then
              break
            fi
            sleep 2
          done

          docker compose exec -T postgres pg_isready -U markos -d markos
          docker compose exec -T redis redis-cli ping
          curl -fsS http://localhost:9200 >/dev/null

      - name: Prepare disposable Instagram test database
        run: |
          docker compose exec -T postgres createdb -U markos markos_ci_test
          docker compose exec -T postgres \
            psql --set=ON_ERROR_STOP=1 -U markos -d markos_ci_test \
            --file=/docker-entrypoint-initdb.d/001-init.sql

      - name: Apply database migrations
        run: corepack pnpm --filter api prisma migrate deploy

      - name: Seed database twice and verify migration status
        run: |
          corepack pnpm --filter api prisma db seed
          corepack pnpm --filter api prisma db seed
          corepack pnpm --filter api prisma migrate status

      - name: Verify
        run: corepack pnpm verify

      - name: Build
        run: corepack pnpm build

      - name: Validate API deployment image
        run: docker build --file apps/api/Dockerfile --tag markos-api:ci .

      - name: Validate web deployment image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
            --file apps/web/Dockerfile \
            --tag markos-web:ci \
            .

      - name: Validate AI deployment image
        run: docker build --file services/ai/Dockerfile --tag markos-ai:ci .

      - name: Smoke-test AI deployment image
        run: |
          container=markos-ai-ci
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container" \
            --env AI_PROFILE_TIMEOUT_SECONDS="$AI_PROFILE_TIMEOUT_SECONDS" \
            --env AI_STRATEGY_TIMEOUT_SECONDS="$AI_STRATEGY_TIMEOUT_SECONDS" \
            --env AI_TEXT_PROVIDER="$AI_TEXT_PROVIDER" \
            --env INTERNAL_SERVICE_TOKEN="$INTERNAL_SERVICE_TOKEN" \
            --env LLM_LONGFORM_MODEL="$LLM_LONGFORM_MODEL" \
            --publish 127.0.0.1:8000:8000 \
            markos-ai:ci

          ready=false
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ai/health >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs "$container"
            exit 1
          fi

          unauthorized_status="$(
            curl --silent --output /dev/null --write-out "%{http_code}" \
              --header "content-type: application/json" \
              --request POST \
              --data '{}' \
              http://127.0.0.1:8000/ai/strategy/generate
          )"
          test "$unauthorized_status" = "401"

          curl --fail --silent \
            --header "Authorization: Bearer $INTERNAL_SERVICE_TOKEN" \
            --header "content-type: application/json" \
            --request POST \
            --data '{"workspace_id":"ci-workspace","horizon_days":90,"locale":"en","context":[{"section":"COMPANY","key":"profile","value":{"name":"CI Coffee"},"score":1}]}' \
            http://127.0.0.1:8000/ai/strategy/generate \
            > /tmp/markos-ai-strategy.json

          jq --exit-status --arg model "$LLM_LONGFORM_MODEL" \
            '.model == $model and .strategy.horizonDays == 90 and .tokens_in > 0 and .tokens_out > 0' \
            /tmp/markos-ai-strategy.json >/dev/null

          curl --fail --silent \
            --header "Authorization: Bearer $INTERNAL_SERVICE_TOKEN" \
            --header "content-type: application/json" \
            --request POST \
            --data '{"workspace_id":"ci-workspace","context":[{"section":"COMPANY","key":"profile","value":{"name":"CI Coffee"},"score":1}]}' \
            http://127.0.0.1:8000/ai/onboarding/profile/generate \
            > /tmp/markos-ai-business-profile.json

          jq --exit-status --arg model "$LLM_LONGFORM_MODEL" \
            '.model == $model and .profile.businessName == "CI Coffee" and (.profile.tagline.en | length) > 0 and (.profile.tagline.ar | length) > 0 and .tokens_in > 0 and .tokens_out > 0' \
            /tmp/markos-ai-business-profile.json >/dev/null

      - name: Install Chromium
        run: corepack pnpm exec playwright-core install --with-deps chromium

      - name: Start built web application
        working-directory: apps/web
        run: |
          node_modules/.bin/next start --hostname 127.0.0.1 --port 3000 \
            > /tmp/markos-web.log 2>&1 &
          echo $! > /tmp/markos-web.pid
          ready=false
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/en/app/settings >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$(cat /tmp/markos-web.pid)" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat /tmp/markos-web.log
            exit 1
          fi

      - name: Test rendered Settings and onboarding
        env:
          SETTINGS_BROWSER_BASE_URL: http://127.0.0.1:3000
        run: corepack pnpm --filter web test:browser

      - name: Dump web application log on failure
        if: failure()
        run: test ! -f /tmp/markos-web.log || cat /tmp/markos-web.log

      - name: Stop built web application
        if: always()
        run: test ! -f /tmp/markos-web.pid || kill "$(cat /tmp/markos-web.pid)" 2>/dev/null || true

      - name: Dump infrastructure logs on failure
        if: failure()
        run: docker compose logs --no-color postgres redis opensearch

      - name: Stop local infrastructure
        if: always()
        run: docker compose down -v
