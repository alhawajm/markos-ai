name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AI_BASE_URL: http://localhost:8000
      API_BASE_URL: http://localhost:4000
      DATABASE_URL: postgresql://markos:markos@localhost:5432/markos
      GOOGLE_OAUTH_ISSUER: https://accounts.google.com
      GOOGLE_OAUTH_JWKS_URL: https://www.googleapis.com/oauth2/v3/certs
      JWT_ACCESS_SECRET: ci-access-secret-change-me
      JWT_REFRESH_SECRET: ci-refresh-secret-change-me
      MEDIA_STORAGE_DIR: var/media
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: test
      SENTRY_TRACES_SAMPLE_RATE: "0"
      NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: "0"
      OPENSEARCH_URL: http://localhost:9200
      REDIS_URL: redis://localhost:6379
      WEB_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Install Node dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install AI Python dependencies
        run: |
          python -m venv services/ai/.venv
          services/ai/.venv/bin/python -m pip install --upgrade pip
          services/ai/.venv/bin/python -m pip install -e "./services/ai[dev]"

      - name: Prepare OpenSearch host settings
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start local infrastructure
        run: docker compose up -d postgres redis opensearch

      - name: Wait for infrastructure
        run: |
          for i in {1..60}; do
            if docker compose exec -T postgres pg_isready -U markos -d markos; then
              break
            fi
            sleep 2
          done

          for i in {1..60}; do
            if docker compose exec -T redis redis-cli ping; then
              break
            fi
            sleep 2
          done

          for i in {1..90}; do
            if curl -fsS http://localhost:9200 >/dev/null; then
              break
            fi
            sleep 2
          done

          docker compose exec -T postgres pg_isready -U markos -d markos
          docker compose exec -T redis redis-cli ping
          curl -fsS http://localhost:9200 >/dev/null

      - name: Apply database migrations
        run: corepack pnpm --filter api prisma migrate deploy

      - name: Seed database
        run: corepack pnpm --filter api prisma db seed

      - name: Verify
        run: corepack pnpm verify

      - name: Build
        run: corepack pnpm build

      - name: Dump infrastructure logs on failure
        if: failure()
        run: docker compose logs --no-color postgres redis opensearch

      - name: Stop local infrastructure
        if: always()
        run: docker compose down -v
